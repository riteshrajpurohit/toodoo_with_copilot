<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe7" />
    <title>Toodoo | A calmer task list</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">Your small corner of order</p>
        <h1>Toodoo<span class="accent">.</span></h1>
        <p class="intro">A simple list for the things worth remembering.</p>
      </header>

      <section class="todo-panel" aria-labelledby="list-heading">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Today</p>
            <h2 id="list-heading">What needs doing?</h2>
          </div>
          <span class="task-count" id="task-count">0 left</span>
        </div>

        <form class="todo-form" id="todo-form">
          <label class="sr-only" for="todo-input">Add a task</label>
          <input id="todo-input" name="todo" type="text" maxlength="120" placeholder="Add a new task..." autocomplete="off" />
          <button type="submit">Add task</button>
        </form>

        <div class="toolbar" aria-label="Task filters">
          <div class="filters" role="group" aria-label="Show tasks">
            <button class="filter-button active" type="button" data-filter="all">All</button>
            <button class="filter-button" type="button" data-filter="active">Open</button>
            <button class="filter-button" type="button" data-filter="completed">Done</button>
          </div>
          <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
        </div>

        <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
        <p class="empty-state" id="empty-state">Your list is clear. Enjoy the breathing room.</p>
      </section>

      <footer class="app-footer">
        <span>Kept on this device</span>
        <span class="footer-dot" aria-hidden="true"></span>
        <span>Private by default</span>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
